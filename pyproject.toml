[project]
name = "whatsapp-tracking-assistant"
version = "0.1.0"
description = "Post-purchase tracking notifications for Latin American merchants"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "email-validator>=2.0.0",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt==4.3.0",
    "phonenumbers",
    "httpx",
    "jinja2",
    "python-multipart",
]

[project.scripts]
app = "backend.app.main:app"

[tool.black]
line-length = 100
target-version = ["py312"]
# Alembic: estilo autogenerado; no formatear.
force-exclude = "/alembic/versions/"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["backend"]
skip_glob = ["alembic/versions/*"]
