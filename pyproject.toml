[project]
name = "whatsapp-tracking-assistant"
version = "0.1.0"
description = "Post-purchase tracking notifications for Latin American merchants"
requires-python = ">=3.12"

[project.scripts]
app = "backend.app.main:app"

[tool.black]
line-length = 100
target-version = ["py312"]
# Alembic: estilo autogenerado; no formatear.
force-exclude = "/alembic/versions/"

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["backend"]
skip_glob = ["alembic/versions/*"]
