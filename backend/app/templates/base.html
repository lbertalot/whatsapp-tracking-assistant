<!DOCTYPE html>
<html lang="es" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/png" href="/static/img/wta-logo.png">
    <link rel="apple-touch-icon" href="/static/img/wta-logo.png">
    <title>{% block title %}WTA{% endblock %} — WhatsApp Tracking Assistant</title>
    <!-- Inter: preconnect + non-blocking stylesheet; Google serves @font-face with font-display:swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"></noscript>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
    <script>
        // Dark mode initialization (respects system preference and localStorage)
        (function() {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const storedTheme = localStorage.getItem('wta_theme');
            if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <a href="/panel" class="brand">
                <img class="brand-logo" src="/static/img/wta-logo.png" alt="WTA">
                <span class="brand-name">WTA</span>
            </a>
            <nav class="header-nav" id="headerNav">
                <a href="/onboarding" id="navOnboarding" style="display:none;">Conectar tienda</a>
                <a href="/panel" id="navOrders" style="display:none;">Ordenes</a>
                <a href="/settings" id="navSettings" style="display:none;">Configuracion</a>
                <span class="store-name" id="headerStoreLabel"></span>
                <button class="btn btn-sm btn-ghost btn-icon" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">
                    <span id="themeIconLight" style="display:none;">☀️</span>
                    <span id="themeIconDark" style="display:none;">🌙</span>
                </button>
                <button class="btn btn-sm btn-secondary" id="logoutBtn" style="display:none;">Cerrar sesion</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="footer-inner">
            <span>WhatsApp Tracking Assistant v0.1.0</span>
            <span class="separator">·</span>
            <span>Latinoamérica</span>
            <span class="separator">·</span>
            <a href="/ayuda/conectar-tiendanube" class="footer-link">Ayuda: Tiendanube</a>
            <span class="separator">·</span>
            <a href="/privacidad" class="footer-link">Privacidad</a>
        </div>
    </footer>

    <script>
        const TOKEN_KEY = 'wta_token';
        const THEME_KEY = 'wta_theme';

        // Theme management
        function getTheme() {
            return localStorage.getItem(THEME_KEY) || 
                   (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function setTheme(theme) {
            localStorage.setItem(THEME_KEY, theme);
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcons();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            var lightIcon = document.getElementById('themeIconLight');
            var darkIcon = document.getElementById('themeIconDark');
            if (lightIcon && darkIcon) {
                lightIcon.style.display = isDark ? 'inline' : 'none';
                darkIcon.style.display = isDark ? 'none' : 'inline';
            }
        }

        function getToken() {
            return localStorage.getItem(TOKEN_KEY);
        }

        function setToken(token) {
            localStorage.setItem(TOKEN_KEY, token);
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_KEY);
        }

        function authHeaders() {
            const t = getToken();
            return t ? { 'Authorization': 'Bearer ' + t } : {};
        }

        function requireAuth() {
            if (!getToken()) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Initialize theme icons
            updateThemeIcons();

            // Theme toggle button
            var themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', toggleTheme);
            }

            var logoutBtn = document.getElementById('logoutBtn');
            var navOrders = document.getElementById('navOrders');
            var navSettings = document.getElementById('navSettings');

            if (logoutBtn && getToken()) {
                logoutBtn.style.display = 'inline-block';
                if (navOrders) navOrders.style.display = 'inline-block';
                if (navSettings) navSettings.style.display = 'inline-block';

                var path = window.location.pathname;
                if (path === '/panel' && navOrders) navOrders.classList.add('nav-active');
                if (path === '/settings' && navSettings) navSettings.classList.add('nav-active');
                if (path === '/onboarding') {
                    var navOnb = document.getElementById('navOnboarding');
                    if (navOnb) navOnb.classList.add('nav-active');
                }

                fetch('/api/onboarding/status', { headers: authHeaders() })
                    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                    .then(function(s) {
                        var navOnb = document.getElementById('navOnboarding');
                        if (navOnb && s.needs_tiendanube) navOnb.style.display = 'inline-block';
                    })
                    .catch(function() {});

                logoutBtn.addEventListener('click', function() {
                    clearToken();
                    window.location.href = '/login';
                });

                fetch('/me', { headers: authHeaders() })
                    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                    .then(function(data) {
                        var el = document.getElementById('headerStoreLabel');
                        if (el) {
                            var line = data.store_name || data.email;
                            if (data.tiendanube_user_id) {
                                line += ' · TN ' + data.tiendanube_user_id;
                            }
                            el.textContent = line;
                        }
                    })
                    .catch(function() {});
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
