<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WTA{% endblock %} — WhatsApp Tracking Assistant</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <a href="/panel" class="brand">
                <span class="brand-icon">📦</span>
                <span class="brand-name">WTA</span>
            </a>
            <nav class="header-nav" id="headerNav">
                <a href="/onboarding" id="navOnboarding" style="display:none;">Conectar tienda</a>
                <a href="/panel" id="navOrders" style="display:none;">Ordenes</a>
                <a href="/settings" id="navSettings" style="display:none;">Configuracion</a>
                <span class="store-name" id="headerStoreLabel"></span>
                <button class="btn btn-sm btn-outline" id="logoutBtn" style="display:none;">Cerrar sesion</button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="footer-inner">
            <span>WhatsApp Tracking Assistant v0.1.0</span>
            <span class="separator">·</span>
            <span>Latinoamérica</span>
            <span class="separator">·</span>
            <a href="/ayuda/conectar-tiendanube" class="footer-link">Ayuda: Tiendanube</a>
        </div>
    </footer>

    <script>
        const TOKEN_KEY = 'wta_token';

        function getToken() {
            return localStorage.getItem(TOKEN_KEY);
        }

        function setToken(token) {
            localStorage.setItem(TOKEN_KEY, token);
        }

        function clearToken() {
            localStorage.removeItem(TOKEN_KEY);
        }

        function authHeaders() {
            const t = getToken();
            return t ? { 'Authorization': 'Bearer ' + t } : {};
        }

        function requireAuth() {
            if (!getToken()) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }

        document.addEventListener('DOMContentLoaded', function() {
            var logoutBtn = document.getElementById('logoutBtn');
            var navOrders = document.getElementById('navOrders');
            var navSettings = document.getElementById('navSettings');

            if (logoutBtn && getToken()) {
                logoutBtn.style.display = 'inline-block';
                if (navOrders) navOrders.style.display = 'inline-block';
                if (navSettings) navSettings.style.display = 'inline-block';

                var path = window.location.pathname;
                if (path === '/panel' && navOrders) navOrders.classList.add('nav-active');
                if (path === '/settings' && navSettings) navSettings.classList.add('nav-active');
                if (path === '/onboarding') {
                    var navOnb = document.getElementById('navOnboarding');
                    if (navOnb) navOnb.classList.add('nav-active');
                }

                fetch('/api/onboarding/status', { headers: authHeaders() })
                    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                    .then(function(s) {
                        var navOnb = document.getElementById('navOnboarding');
                        if (navOnb && s.needs_tiendanube) navOnb.style.display = 'inline-block';
                    })
                    .catch(function() {});

                logoutBtn.addEventListener('click', function() {
                    clearToken();
                    window.location.href = '/login';
                });

                fetch('/me', { headers: authHeaders() })
                    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                    .then(function(data) {
                        var el = document.getElementById('headerStoreLabel');
                        if (el) {
                            var line = data.store_name || data.email;
                            if (data.tiendanube_user_id) {
                                line += ' · TN ' + data.tiendanube_user_id;
                            }
                            el.textContent = line;
                        }
                    })
                    .catch(function() {});
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
