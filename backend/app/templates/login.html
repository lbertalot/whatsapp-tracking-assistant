{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">Iniciar sesión</h1>
        <p class="login-subtitle">Accedé a tu panel de seguimiento de envíos</p>
        <p class="login-help-link"><a href="/register">Crear cuenta</a> · <a href="/ayuda/conectar-tiendanube">¿Cómo conectar mi Tiendanube?</a></p>

        <div class="alert alert-error" id="loginError" style="display:none;"></div>

        <form id="loginForm" method="POST" action="/auth/login">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="tu@empresa.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required
                       placeholder="Tu contraseña" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                Ingresar
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    btn.disabled = true;
    btn.textContent = 'Ingresando...';
    errEl.style.display = 'none';

    try {
        const resp = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });

        if (!resp.ok) {
            const data = await resp.json().catch(() => ({}));
            throw new Error(data.detail || 'Credenciales incorrectas');
        }

        const data = await resp.json();
        setToken(data.access_token);
        try {
            const st = await fetch('/api/onboarding/status', {
                headers: { 'Authorization': 'Bearer ' + data.access_token }
            });
            if (st.ok) {
                const o = await st.json();
                if (o.needs_tiendanube) {
                    window.location.href = '/onboarding';
                    return;
                }
            }
        } catch (e) {}
        window.location.href = '/panel';
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Ingresar';
    }
});

if (getToken()) {
    fetch('/api/onboarding/status', { headers: authHeaders() })
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(o) {
            if (o.needs_tiendanube) window.location.href = '/onboarding';
            else window.location.href = '/panel';
        })
        .catch(function() { window.location.href = '/panel'; });
}
</script>
{% endblock %}
