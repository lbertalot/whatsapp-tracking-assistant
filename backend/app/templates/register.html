{% extends "base.html" %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">Crear cuenta</h1>
        <p class="login-subtitle">Registrá tu tienda y luego vinculá Tiendanube</p>
        <p class="login-help-link"><a href="/login">¿Ya tenés cuenta? Iniciar sesión</a> · <a href="/ayuda/conectar-tiendanube">Ayuda Tiendanube</a></p>

        <div class="alert alert-error" id="registerError" style="display:none;"></div>

        <form id="registerForm" method="POST" action="/auth/register">
            <div class="form-group">
                <label for="storeName">Nombre de tu tienda</label>
                <input type="text" id="storeName" name="store_name" required minlength="2" maxlength="150"
                       placeholder="Mi tienda" autocomplete="organization">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="tu@empresa.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="8"
                       placeholder="Mínimo 8 caracteres" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                Registrarme
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    const errEl = document.getElementById('registerError');
    btn.disabled = true;
    btn.textContent = 'Creando cuenta...';
    errEl.style.display = 'none';

    try {
        const resp = await fetch('/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                store_name: document.getElementById('storeName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            })
        });

        if (!resp.ok) {
            const data = await resp.json().catch(() => ({}));
            let msg = data.detail || 'No se pudo crear la cuenta';
            if (Array.isArray(data.detail)) {
                msg = data.detail.map(function(d) { return d.msg || d; }).join('. ');
            }
            throw new Error(msg);
        }

        const data = await resp.json();
        setToken(data.access_token);
        try {
            const st = await fetch('/api/onboarding/status', {
                headers: { 'Authorization': 'Bearer ' + data.access_token }
            });
            if (st.ok) {
                const o = await st.json();
                if (o.needs_tiendanube) {
                    window.location.href = '/onboarding';
                    return;
                }
            }
        } catch (e) {}
        window.location.href = '/panel';
    } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Registrarme';
    }
});

if (getToken()) {
    fetch('/api/onboarding/status', { headers: authHeaders() })
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(o) {
            if (o.needs_tiendanube) window.location.href = '/onboarding';
            else window.location.href = '/panel';
        })
        .catch(function() { window.location.href = '/panel'; });
}
</script>
{% endblock %}
