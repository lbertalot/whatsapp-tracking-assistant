version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/Asuncion"
    open-pull-requests-limit: 10
    reviewers:
      - "lbertalot"
    labels:
      - "dependencies"
      - "python"
    versioning-strategy: "increase-if-necessary"
    # passlib 1.7.x + bcrypt 5 rompe en runtime (ValueError en backend bcrypt / tests).
    ignore:
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    # Mantener línea base 3.11 del proyecto; saltos tipo 3.14 requieren validación manual.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
